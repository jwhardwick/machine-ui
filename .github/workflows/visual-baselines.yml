# Creates Linux screenshot baselines for review. A human downloads, inspects and commits them;
# only a human can approve a new baseline.
name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @machine-ui/storybook exec playwright install --with-deps chromium
      - run: pnpm --filter @machine-ui/storybook test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: apps/storybook/visual/__screenshots__/**/*-linux.png
